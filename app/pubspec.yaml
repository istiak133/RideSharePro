name: rideshare_app
description: RideShare AI Pro — Ride Sharing & Parcel Delivery App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  lottie: ^3.3.1

  # State Management
  provider: ^6.1.2

  # HTTP & API
  http: ^1.3.0
  
  # Maps (FREE - No API key needed)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  
  # Location
  geolocator: ^14.0.0
  geocoding: ^3.0.0
  
  # Storage
  shared_preferences: ^2.5.3
  
  # Supabase (Realtime chat)
  supabase_flutter: ^2.9.0
  
  # WebView (bKash payment)
  webview_flutter: ^4.13.1
  
  # Utils
  intl: ^0.20.2
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  pin_code_fields: ^8.0.1
  flutter_rating_bar: ^4.0.1
  badges: ^3.1.2
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/animations/
